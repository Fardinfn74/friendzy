<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- White die-cut outline -->
  <circle cx="50" cy="50" r="42" fill="#ffffff" stroke="#1b1b2f" stroke-width="6" />
  <!-- Circular board ring -->
  <circle cx="50" cy="50" r="36" fill="#f6ebd1" stroke="#1b1b2f" stroke-width="3.5" />
  <!-- Corner pocket indicator -->
  <path d="M 22,22 A 10,10 0 0,1 36,22 L 22,36 Z" fill="#1b1b2f" />
  <!-- Striker Coin (Flicking forward) -->
  <circle cx="38" cy="62" r="16" fill="#2ba39b" stroke="#1b1b2f" stroke-width="3.5" />
  <circle cx="38" cy="62" r="10" stroke="#ffffff" stroke-width="2.5" fill="none" />
  <!-- Flick speed lines -->
  <line x1="20" y1="74" x2="28" y2="68" stroke="#1b1b2f" stroke-width="3" stroke-linecap="round" />
  <line x1="24" y1="80" x2="32" y2="74" stroke="#1b1b2f" stroke-width="3" stroke-linecap="round" />
  <!-- Carrom Red Queen -->
  <circle cx="64" cy="38" r="11" fill="#d93a2b" stroke="#1b1b2f" stroke-width="3" />
  <polygon points="64,32 66,36 70,37 67,40 68,44 64,42 60,44 61,40 58,37 62,36" fill="#f2b632" />
  <!-- Carrom White & Black coin -->
  <circle cx="68" cy="60" r="8" fill="#ffffff" stroke="#1b1b2f" stroke-width="2.5" />
  <circle cx="52" cy="34" r="8" fill="#1b1b2f" stroke="#3d3d5c" stroke-width="2" />
</svg>
