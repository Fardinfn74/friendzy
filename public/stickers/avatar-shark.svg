<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- White die-cut outline -->
  <path d="M 50,12 C 50,22 46,28 36,34 C 20,44 14,64 24,78 C 32,88 46,90 56,90 C 70,90 84,78 86,62 C 88,44 76,28 64,24 C 54,20 50,12 50,12 Z" 
        fill="#ffffff" stroke="#1b1b2f" stroke-width="6" stroke-linejoin="round" />
  <!-- Shark Head Base -->
  <path d="M 50,18 C 50,26 44,32 38,36 C 24,44 20,62 28,74 C 36,84 48,84 56,84 C 68,84 80,74 80,60 C 80,44 70,30 58,26 C 54,24 50,18 50,18 Z" 
        fill="#38bdf8" stroke="#1b1b2f" stroke-width="3" />
