  <path d="M 32,74 C 40,80 50,80 58,80 C 66,80 72,74 74,68 C 66,70 54,72 44,66 C 36,60 32,70 32,74 Z" fill="#ffffff" />
  <!-- Dorsal Fin Topper -->
  <polygon points="50,16 44,32 54,30" fill="#0284c7" stroke="#1b1b2f" stroke-width="2" />
  <!-- Shark Grin with Teeth -->
  <path d="M 36,60 Q 50,72 66,60" stroke="#1b1b2f" stroke-width="3" fill="#1b1b2f" />
  <polygon points="42,60 45,64 48,60" fill="#ffffff" />
  <polygon points="48,60 51,64 54,60" fill="#ffffff" />
  <polygon points="54,60 57,64 60,60" fill="#ffffff" />
  <!-- Eye -->
  <circle cx="56" cy="46" r="4" fill="#1b1b2f" />
  <circle cx="57" cy="45" r="1.5" fill="#ffffff" />
  <!-- Gill slits -->
  <line x1="68" y1="48" x2="68" y2="54" stroke="#1b1b2f" stroke-width="2" stroke-linecap="round" />
  <line x1="72" y1="46" x2="72" y2="52" stroke="#1b1b2f" stroke-width="2" stroke-linecap="round" />
</svg>
