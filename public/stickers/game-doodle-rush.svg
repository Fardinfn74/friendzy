<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- White die-cut outline -->
  <path d="M 30,12 C 55,8 85,14 90,36 C 94,54 84,76 68,88 C 50,98 22,96 12,80 C 4,66 6,38 18,22 C 22,16 26,13 30,12 Z"
        fill="#ffffff" stroke="#1b1b2f" stroke-width="6" stroke-linejoin="round" />

  <!-- Artist Palette -->
  <path d="M 28,20 C 50,14 80,22 84,40 C 87,54 80,72 66,82 C 50,92 24,90 16,76 C 8,62 10,38 20,26 Z"
        fill="#f6ebd1" stroke="#1b1b2f" stroke-width="3.5" />
  
  <!-- Thumb Hole -->
  <ellipse cx="68" cy="64" rx="6" ry="8" fill="#ffffff" stroke="#1b1b2f" stroke-width="3" transform="rotate(20 68 64)" />

  <!-- Colorful Paint Blobs -->
  <circle cx="30" cy="30" r="6" fill="#ff4d4d" stroke="#1b1b2f" stroke-width="2.5" />
  <circle cx="28" cy="29" r="2" fill="#ffffff" opacity="0.6" />

  <circle cx="48" cy="24" r="6.5" fill="#f2b632" stroke="#1b1b2f" stroke-width="2.5" />
  <circle cx="46" cy="23" r="2.2" fill="#ffffff" opacity="0.6" />

  <circle cx="66" cy="30" r="6" fill="#2ba39b" stroke="#1b1b2f" stroke-width="2.5" />
  <circle cx="64" cy="29" r="2" fill="#ffffff" opacity="0.6" />

  <circle cx="26" cy="48" r="5.5" fill="#a855f7" stroke="#1b1b2f" stroke-width="2.5" />
  <circle cx="24" cy="47" r="1.8" fill="#ffffff" opacity="0.6" />

  <circle cx="28" cy="66" r="5" fill="#3b82f6" stroke="#1b1b2f" stroke-width="2.5" />

  <!-- Dynamic Rainbow Swoop / Brushstroke -->
  <path d="M 38,72 Q 52,60 76,42" stroke="#a855f7" stroke-width="8" stroke-linecap="round" />
  <path d="M 38,72 Q 52,60 76,42" stroke="#f2b632" stroke-width="4" stroke-linecap="round" />

  <!-- Paintbrush crossing over -->
  <g transform="rotate(-35 60 50)">
    <!-- Wooden Handle -->
    <path d="M 58,15 L 62,15 L 63,64 L 57,64 Z" fill="#d97706" stroke="#1b1b2f" stroke-width="3" stroke-linejoin="round" />
    <!-- Metal Ferrule -->
    <rect x="56" y="64" width="8" height="10" rx="1.5" fill="#e2e8f0" stroke="#1b1b2f" stroke-width="2.5" />
    <!-- Bristles -->
    <path d="M 56,74 C 56,86 64,86 64,74 Z" fill="#1b1b2f" stroke="#1b1b2f" stroke-width="2.5" />
    <!-- Wet paint tip on brush -->
    <path d="M 57,80 C 58,86 63,86 63,80 Z" fill="#ff4d4d" />
  </g>

  <!-- Sparkle doodles -->
  <polygon points="82,18 84,23 89,24 84,26 82,31 80,26 75,24 80,23" fill="#ffffff" stroke="#1b1b2f" stroke-width="2" />
  <polygon points="50,78 52,82 56,83 52,85 50,89 48,85 44,83 48,82" fill="#f2b632" stroke="#1b1b2f" stroke-width="1.8" />
</svg>
