  <circle cx="24" cy="44" r="8" fill="#d93a2b" stroke="#1b1b2f" stroke-width="2.5" />
  <circle cx="76" cy="44" r="8" fill="#d93a2b" stroke="#1b1b2f" stroke-width="2.5" />
  <!-- Eyes -->
