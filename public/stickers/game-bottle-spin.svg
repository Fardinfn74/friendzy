<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- White die-cut outline -->
  <circle cx="50" cy="50" r="42" fill="#ffffff" stroke="#1b1b2f" stroke-width="6" />
  <!-- Spinning Arrow Wheel Background -->
  <circle cx="50" cy="50" r="36" fill="#f6ebd1" stroke="#1b1b2f" stroke-width="3" stroke-dasharray="6 4" />
  <!-- Curved Spin Arrow -->
  <path d="M 24,50 A 26,26 0 1,1 50,76" fill="none" stroke="#f2b632" stroke-width="5" stroke-linecap="round" />
  <polygon points="46,82 56,76 48,70" fill="#f2b632" stroke="#1b1b2f" stroke-width="2" />
  <!-- Retro Soda Bottle (Tilted) -->
  <g transform="rotate(40 50 50)">
    <!-- Bottle Neck & Cap -->
    <rect x="47" y="16" width="6" height="8" rx="1" fill="#d93a2b" stroke="#1b1b2f" stroke-width="2" />
    <path d="M 45,24 L 45,34 L 40,42 L 40,76 C 40,80 44,84 50,84 C 56,84 60,80 60,76 L 60,42 L 55,34 L 55,24 Z" 
          fill="#2ba39b" stroke="#1b1b2f" stroke-width="3.5" />
    <!-- Bottle Label -->
    <rect x="40" y="48" width="20" height="18" fill="#f2b632" stroke="#1b1b2f" stroke-width="2" />
    <line x1="42" y1="57" x2="58" y2="57" stroke="#d93a2b" stroke-width="3" />
  </g>
</svg>
