  <path d="M 26,76 C 26,62 36,54 50,54 C 64,54 74,62 74,76 L 76,88 L 24,88 Z" fill="#2c2c4b" stroke="#1b1b2f" stroke-width="3" />
  <!-- Fedora Hat Brim -->
  <ellipse cx="50" cy="42" rx="34" ry="10" fill="#d93a2b" stroke="#1b1b2f" stroke-width="3.5" />
  <!-- Fedora Crown -->
  <path d="M 30,40 C 32,24 40,20 50,20 C 60,20 68,24 70,40 Z" fill="#d93a2b" stroke="#1b1b2f" stroke-width="3.5" />
  <rect x="33" y="34" width="34" height="6" rx="2" fill="#1b1b2f" />
  <!-- Glowing Eyes in Shadow -->
  <ellipse cx="42" cy="48" rx="4" ry="3" fill="#f2b632" />
  <ellipse cx="58" cy="48" rx="4" ry="3" fill="#f2b632" />
  <!-- Magnifying Glass Overlay -->
  <circle cx="68" cy="66" r="14" fill="#2ba39b" fill-opacity="0.6" stroke="#ffffff" stroke-width="3.5" />
  <circle cx="68" cy="66" r="14" stroke="#1b1b2f" stroke-width="3.5" />
  <line x1="78" y1="76" x2="90" y2="88" stroke="#1b1b2f" stroke-width="6" stroke-linecap="round" />
  <line x1="78" y1="76" x2="90" y2="88" stroke="#f2b632" stroke-width="3" stroke-linecap="round" />
  <!-- Red question mark inside glass -->
  <text x="68" y="72" text-anchor="middle" font-family="'Lilita One', sans-serif" font-size="14" font-weight="900" fill="#ffffff">?</text>
</svg>
