<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- White die-cut outline -->
  <path d="M 50,8 C 50,8 38,28 32,46 L 18,48 C 14,48 14,54 18,56 L 24,58 C 22,66 22,78 32,86 C 42,92 58,92 68,86 C 78,78 78,66 76,58 L 82,56 C 86,54 86,48 82,48 L 68,46 C 62,28 50,8 50,8 Z" 
        fill="#ffffff" stroke="#1b1b2f" stroke-width="6" stroke-linejoin="round" />
  <!-- Wizard Hat -->
  <path d="M 50,12 C 50,12 38,32 34,48 L 66,48 C 62,32 50,12 50,12 Z" fill="#7c4dff" stroke="#1b1b2f" stroke-width="3" />
  <!-- Hat Brim -->
  <ellipse cx="50" cy="50" rx="30" ry="7" fill="#7c4dff" stroke="#1b1b2f" stroke-width="2.5" />
  <!-- Gold Stars on Hat -->
  <polygon points="48,26 49,29 52,29 50,31 51,34 48,32 45,34 46,31 44,29 47,29" fill="#f2b632" />
  <polygon points="56,38 57,40 59,40 58,42 58,44 56,43 54,44 55,42 53,40 55,40" fill="#f2b632" />
  <!-- Fluffy White Beard -->
  <path d="M 32,54 C 28,66 30,84 50,86 C 70,84 72,66 68,54 Z" fill="#f6ebd1" stroke="#1b1b2f" stroke-width="2.5" />
  <!-- Nose peaking over beard -->
  <circle cx="50" cy="54" r="5" fill="#f28e2b" stroke="#1b1b2f" stroke-width="1.5" />
  <!-- Twinkling Eyes under brim -->
  <path d="M 38,48 Q 42,44 46,48" stroke="#1b1b2f" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 54,48 Q 58,44 62,48" stroke="#1b1b2f" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
