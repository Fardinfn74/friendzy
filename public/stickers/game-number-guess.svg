<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- White die-cut outline -->
  <rect x="12" y="14" width="76" height="76" rx="24" fill="#ffffff" stroke="#1b1b2f" stroke-width="6" />
  <!-- Vault/Calculator Pad -->
  <rect x="16" y="18" width="68" height="68" rx="20" fill="#2ba39b" stroke="#1b1b2f" stroke-width="3.5" />
  <!-- Digital Display Screen -->
  <rect x="24" y="26" width="52" height="22" rx="7" fill="#1b1b2f" />
  <text x="50" y="42" text-anchor="middle" font-family="'Lilita One', sans-serif" font-weight="900" font-size="16" fill="#f2b632" letter-spacing="3">7 · ? · 9</text>
  <!-- Chunky Buttons -->
  <rect x="26" y="54" width="14" height="14" rx="4" fill="#ffffff" stroke="#1b1b2f" stroke-width="2.5" />
  <text x="33" y="65" text-anchor="middle" font-family="'Lilita One', sans-serif" font-weight="900" font-size="11" fill="#1b1b2f">1</text>
  <rect x="43" y="54" width="14" height="14" rx="4" fill="#f2b632" stroke="#1b1b2f" stroke-width="2.5" />
  <text x="50" y="65" text-anchor="middle" font-family="'Lilita One', sans-serif" font-weight="900" font-size="11" fill="#1b1b2f">2</text>
  <rect x="60" y="54" width="14" height="14" rx="4" fill="#d93a2b" stroke="#1b1b2f" stroke-width="2.5" />
  <text x="67" y="65" text-anchor="middle" font-family="'Lilita One', sans-serif" font-weight="900" font-size="11" fill="#ffffff">3</text>
  <!-- Up/Down arrows -->
  <polygon points="50,71 45,78 55,78" fill="#ffffff" stroke="#1b1b2f" stroke-width="1.5" />
</svg>
